openapi: 3.2.0
info:
  title: 54ch10 /v1/open + $1 Stack API
  description: 'GET /v1/open — URL brief + whois + page markdown + page_risk/one-hop, $0.015 USDC on Base. Or GET /v1/stack?pack=1 for $1 prepaid (80 calls). Bulk: POST /v1/open/batch (N×$0.015, cap 25, paid-only; human https://linksafu.com/bulk). Wire: https://54ch10.uk/wire.md. Analytics-only — not financial, legal, or investment advice. Remaining toolkit: open/batch (bulk), brief, domain (whois+dns+tls), whois/RDAP, DNS, TLS/CT, URL normalize, public fetch, ephemeral paste, hash, encode. Canonical paid paths return HTTP 402 + x402 PAYMENT-REQUIRED (USDC $0.001–$100.00 Base preferred) unless Bearer 54k_ or PAYMENT-SIGNATURE. Demo free: X-54ch10-Free: 1 or GET /v1//free (5/day/IP). Discovery: GET /.well-known/x402.'
  version: 0.8.1-bulk-slack-thin
  contact:
    name: 54ch10
    url: https://54ch10.uk/wire.md
    email: brainpowerux@gmail.com
  license:
    name: Proprietary
    url: https://54ch10.uk/LEGAL_DISCLAIMER.txt
  x-apisguru-categories:
  - security
  - cryptocurrency
  x-logo:
    url: https://54ch10.uk/favicon.ico
  x-x402:
    discovery: https://54ch10.uk/.well-known/x402
    pricesUsd:
      brief: '0.01'
      whois: '0.005'
      dns: '0.002'
      tls: '0.005'
      normalize-url: '0.001'
      hash: '0.001'
      encode: '0.001'
      fetch: '0.005'
      paste-write: '0.002'
      paste-read: '0.001'
      open: '0.015'
      open_batch: N×0.015 (cap 25)
      domain: '0.008'
      stack: '1.00'
      stack_5: '5.00'
      stack_25: '25.00'
      stack_100: '100.00'
    networks:
    - eip155:8453
    - solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
    payToEvm: '0xF9eb0Caa13B78f92E2850bf5961eB9736354aA3d'
    payToSolana: EcGUGSda9VNzYgUmYA8mTg88MhNYeyA5tgaCgwzxfFNs
    facilitator: https://facilitator.payai.network
servers:
- url: https://54ch10.uk
  description: Production
tags:
- name: Stack
paths:
  /v1/stack:
    get:
      operationId: getStack
      summary: Buy prepaid stack pack or read remaining
      description: 'Bare GET or pack=1 → HTTP 402 (USDC $1.00 → 80 credits, 7-day TTL). pack=5 → $5/500/30d; pack=25 → $25/3000/90d; pack=100 → $100/15000/180d. Invalid pack → 400 before settle. GET ?id= returns remaining (no extra charge). Then send X-54ch10-Stack: . Unused credits expire. NOT a vault. Not refundable.'
      parameters:
      - name: pack
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '5'
          - '25'
          - '100'
        description: Prepaid pack size (default 1)
      - name: amount
        in: query
        required: false
        schema:
          type: string
        description: Alias for pack (1|5|25|100)
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: Stack id for remaining lookup
      - $ref: '#/components/parameters/PaymentSignature'
      responses:
        '200':
          description: '{ok,pack,paid_usd,credits,ttl_days,header,expires,note} or remaining'
        '400':
          description: Invalid pack
        '402':
          description: Payment Required (x402 exact per pack)
        '404':
          description: Unknown or expired stack id
      tags:
      - Stack
    post:
      operationId: postStack
      summary: Buy prepaid stack pack
      description: x402 exact per pack (default $1.00 → 80 credits / 7d). Query pack= or amount=. Unused credits expire. Wallet-bound. NOT a vault. Not refundable.
      parameters:
      - name: pack
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '5'
          - '25'
          - '100'
      - name: amount
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/PaymentSignature'
      responses:
        '200':
          description: '{ok,pack,paid_usd,credits,ttl_days,header,expires,note}'
        '400':
          description: Invalid pack
        '402':
          description: Payment Required
      tags:
      - Stack
components:
  parameters:
    PaymentSignature:
      name: PAYMENT-SIGNATURE
      in: header
      required: false
      schema:
        type: string
      description: Base64-encoded x402 v2 PaymentPayload after client signs USDC authorization
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 54k_
      description: Optional paid API key (54k_…). Alternatively pay per call with x402 USDC.
