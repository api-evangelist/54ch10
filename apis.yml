aid: 54ch10
name: 54ch10
description: >-
  54ch10 serves pre-interact risk briefs for wallet addresses, tokens and URLs — phishing, scam,
  honeypot and URL-reputation heuristics an agent can call BEFORE it signs, approves, bridges or
  opens a dapp URL. A brief returns a 0–100 score where higher is more concerning, a band, flags,
  a summary and the sources behind it, so a caller can gate its next tool call on policy: refuse
  on critical, require human confirmation on elevated. The provider describes it as analytics-only
  and explicitly not financial, legal or investment advice. Four operations over OpenAPI 3.0,
  bearer authenticated, with a free tier and an x402 machine-payment surface on Base.
