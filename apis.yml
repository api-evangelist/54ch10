x-provenance:
  added: '2026-08-24'
  method: searched
  source: https://54ch10.uk/openapi.json
  note: >-
    Submitted via apis.io/add on 2026-08-24 and auto-published by the gate at rating 37. The
    submitted APIs.json at https://54ch10.uk/apis.json returns 404 against a control that also
    404s with an identical 531-byte JSON body, so the 404 is real — a bad pointer in the
    submission, not an absent surface. There is no llms.txt either.
    What IS served was fetched and confirmed: OpenAPI 3.0.3 at /openapi.json (4 paths, bearer
    auth, though zero component schemas), an AGENT.md written directly at agents rather than at
    humans, and an x402 discovery document at /.well-known/x402 declaring x402Version 2 on the
    Base network with the payai facilitator. /health returns 200 JSON. Both brief endpoints return
    400 JSON on a malformed call, which is validation rather than a stub.
    The AGENT.md is the interesting artifact: it tells a calling agent the order of operations —
    resolve the target, GET /v1/brief, then gate the next tool call on the returned band — and
    tells operators to log cached_at and sources[].status so they can tell a stub signal from a
    live one. It is kept here in full.
    Note the brand: the provider states it is "54ch10", NOT "SACHIO".
